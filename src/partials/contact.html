<!-- ================= CONTACT ================= -->
<section class="page" id="page-contact">
  <div class="page-head"><div class="wrap rv">
    <p class="eyebrow"><span>Contact</span></p>
    <h1>Let's start a conversation</h1>
    <p class="lead mono" style="font-size:12px;letter-spacing:.28em;text-transform:uppercase">United States · Canada</p>
  </div></div>
  <section class="section" style="padding-top:0"><div class="wrap ct-grid">
    <div class="ct-col">
      <div class="offices glass rv" style="--d:.1s">
        <h3 style="font:600 1.25rem 'Fraunces';padding:20px 10px 6px">Where to Find Us</h3>
        <div class="office"><div><strong>Pennsauken, New Jersey <span class="hq-chip">HQ</span></strong><p class="addr">815 Hylton Rd, Pennsauken, NJ 08110, United States</p></div></div>
      </div>
    </div>
    <div class="ct-col">
      <div class="form-card glass rv" style="--d:.08s">
        <h3>Send a Message</h3>
        <form class="js-contact" novalidate>
          <div class="f-grid">
            <div class="field"><input id="fName" name="name" type="text" placeholder=" " required><label for="fName">Full name</label></div>
            <div class="field"><input id="fMail" name="email" type="email" placeholder=" " required><label for="fMail">Work email</label></div>
            <div class="field"><input id="fComp" name="company" type="text" placeholder=" "><label for="fComp">Company</label></div>
            <div class="field">
              <select id="fInt" name="interest"><option value="" selected></option><option>Product Research &amp; Data</option><option>Sourcing &amp; Quality Control</option><option>Marketplace Operations</option><option>Advertising &amp; PPC</option><option>Fulfilment &amp; Logistics</option><option>Brand &amp; Content</option><option>Wholesale Enquiry</option></select>
              <label for="fInt">Area of interest</label>
              <svg class="sel-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="field full"><textarea id="fMsg" name="message" placeholder=" " required></textarea><label for="fMsg">How can we help?</label></div>
          </div>
          <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
          <button class="btn btn-solid" type="submit"><span>Send Message</span></button>
          <p class="fine form-err" hidden></p>
        </form>
        <div class="form-ok">
          <svg class="ok-ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><path d="M26 41l10 10 18-20"/></svg>
          <h4>✓</h4><p>Thank you, your message has been received. We reply within one business day.</p>
        </div>
      </div>
    </div>
  </div></section>
</section>
