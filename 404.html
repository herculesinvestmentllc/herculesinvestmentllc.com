<!DOCTYPE html>

<head>

<!-- Standalone page: served by ErrorDocument, so it must not depend on the app's
     JS or CSS. Inline styles are allowed by the deployed CSP (style-src unsafe-inline). -->
<style>
  :root{--bg:#0B1F3A;--bg2:#133157;--ink:#EAF1FB;--muted:#8CA0BC;--gold:#C9A55C}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
       background:radial-gradient(900px 520px at 82% -10%,rgba(201,165,92,.16),transparent 60%),var(--bg);
       color:var(--ink);text-align:center}
  .card{max-width:520px}
  svg{width:96px;height:114px;margin:0 auto 28px;display:block}
  .code{font-size:14px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  h1{font-size:clamp(28px,5vw,40px);font-weight:600;line-height:1.15;margin-bottom:14px}
  p{color:var(--muted);line-height:1.6;margin-bottom:28px}
  a{display:inline-block;padding:13px 26px;border-radius:10px;background:var(--gold);
    color:#0B1F3A;font-weight:600;text-decoration:none;transition:transform .2s}
  a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 440 520" aria-hidden="true"><g fill="none" stroke="#C9A55C" stroke-width="62"><path d="M70 35V465"/><path d="M165 95V215H285"/><path d="M165 290H285V445H385"/><path d="M350 45V345"/></g></svg>
    <p class="code">Error 404</p>
    <h1>This page does not exist.</h1>
    <p>The address may be misspelled, or the page may have moved. Head back to the homepage to keep browsing.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
