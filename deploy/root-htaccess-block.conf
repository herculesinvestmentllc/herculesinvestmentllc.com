# BEGIN hercules-security
# Managed by .cpanel.yml: every deploy replaces the lines between these two
# markers and leaves the rest of public_html/.htaccess (PHP handler, cache
# rules added by cPanel) untouched. Edit this file in the repo, not on the server.
#
# HTTP -> HTTPS is done with cPanel > Domains > "Force HTTPS Redirect", not
# here: the host fronts the site with a proxy, and a RewriteRule on %{HTTPS}
# can loop behind it.

# Directory listings: nothing here needs them, so refuse them. cPanel's
# default is usually off already; this makes it explicit.
Options -Indexes

# Custom error page (deployed to public_html/404.html by .cpanel.yml).
ErrorDocument 404 /404.html

# Compress the text the site serves. Images and fonts are already compressed, so
# they are left alone. cPanel may enable this already; setting it is harmless.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml
    AddOutputFilterByType DEFLATE application/javascript application/json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Caching. The asset filenames carry no version or hash, so a long max-age would
# serve a stale stylesheet after a deploy; keep the CSS/JS window short and let
# the HTML be revalidated every time (it is small and changes on each deploy).
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/html "access plus 0 seconds"
    ExpiresByType text/plain "access plus 1 day"
    ExpiresByType application/xml "access plus 1 day"
    ExpiresByType text/css "access plus 1 day"
    ExpiresByType application/javascript "access plus 1 day"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/x-icon "access plus 30 days"
</IfModule>

<IfModule mod_headers.c>
    # HTML, XML and text can change on any deploy; revalidate them every time.
    <FilesMatch "\.(html|xml|txt)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # One year. Set after HTTPS is confirmed working on the host: a browser that
    # sees this will refuse plain HTTP to this host for the whole max-age.
    # includeSubDomains is deliberately omitted: cPanel's webmail/cpanel hostnames
    # may not be HTTPS, and that flag would lock them out.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # Scripts live in assets/js, so script-src needs no 'unsafe-inline'.
    # style-src keeps it for the style="" attributes in index.html.
    # scripts/check-csp.mjs runs in CI and fails the build if index.html gains an
    # inline <script> or an inline on*= handler, which this policy would refuse.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
</IfModule>

# Never serve dumps, backups, editor leftovers or deploy/config files.
<FilesMatch "(\.(sql|bak|old|orig|save|swp|tmp|yml|yaml|md|log|ini|sh|conf|dist)|~)$">
    Require all denied
</FilesMatch>
# END hercules-security
